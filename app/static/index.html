<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florida POI's</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bd:#d7d9de; --bg:#f6f7f9; --ac:#1f6feb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px system-ui, sans-serif; display:grid; grid-template-columns: 420px 1fr; height:100vh; }
  #side { display:flex; flex-direction:column; border-right:1px solid var(--bd); min-height:0; }
  #map { height:100vh; }
  header { padding:10px; border-bottom:1px solid var(--bd); background:var(--bg); }
  header h1 { font-size:15px; margin:0 0 8px; }
  textarea, select, input[type=text], input[type=number] { width:100%; padding:6px; border:1px solid var(--bd); border-radius:6px; font:inherit; }
  button { padding:6px 10px; border:1px solid var(--bd); border-radius:6px; background:#fff; cursor:pointer; font:inherit; }
  button.primary { background:var(--ac); color:#fff; border-color:var(--ac); }
  .row { display:flex; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:90px; }
  #list { overflow:auto; flex:1; }
  .cat { position:sticky; top:0; background:var(--bg); padding:5px 10px; font-weight:600; border-bottom:1px solid var(--bd); }
  .poi { padding:8px 10px; border-bottom:1px solid #eceef1; display:grid; grid-template-columns: 24px 1fr; gap:8px; cursor:pointer; }
  .poi:hover { background:#f3f6fb; }
  .poi.sel { background:#eaf2ff; outline:2px solid var(--ac); outline-offset:-2px; }
  #detail { padding:10px; border-bottom:2px solid var(--ac); background:#fff; max-height:58vh; overflow:auto; }
  #detail small { color:#667; display:block; }
  #detail .acts button { flex:1; }
  #detail button.keep.on { background:#dff5e3; border-color:#3cb44b; }
  #detail button.rej.on { background:#fde8e8; border-color:#e6194b; }
  #detail .src { margin-top:8px; font-size:12px; }
  #detail blockquote { margin:2px 0; padding-left:8px; border-left:3px solid var(--bd); color:#445; }
  kbd { font:11px monospace; border:1px solid var(--bd); border-radius:3px; padding:0 3px; background:#fff; }
  .poi.reject { opacity:.45; }
  .poi .n { font-weight:600; cursor:pointer; }
  .poi small { color:#667; display:block; }
    .tag { font-size:11px; padding:1px 6px; border-radius:10px; background:#e8eefc; margin-left:4px; }
  .tag.synced { background:#dff5e3; }
  .posts { padding:8px 10px; font-size:12px; border-top:1px solid var(--bd); max-height:25vh; overflow:auto; background:var(--bg); }
  .posts textarea { height:46px; margin-top:4px; }
  #msg { font-size:12px; color:#555; margin-top:4px; min-height:16px; }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Florida POI's <span id="counts" style="font-weight:400;color:#667"></span></h1>
    <textarea id="urls" rows="2" placeholder="Plak Instagram-URL's (één of meer)…"></textarea>
    <div class="row"><button class="primary" id="add">Toevoegen &amp; parsen</button></div>
    <div id="msg"></div>
    <div class="row">
      <select id="fStatus"><option value="active">Alle behalve afgewezen</option><option value="">Alle statussen</option><option value="new">Nieuw</option><option value="keep">Houden</option><option value="reject">Afgewezen</option></select>
      <select id="fCat"><option value="">Alle categorieën</option></select>
    </div>
    <div class="row">
      <label style="flex:2">Max. afstand tot <select id="fBase" style="width:auto;display:inline"></select></label>
      <input type="number" id="fKm" value="80" min="1"> <span style="flex:0">km</span>
    </div>
    <details id="tools" style="margin-top:8px"><summary>Wanderlog &amp; beheer</summary>
      <div class="row"><button id="refresh">Ververs</button><button id="retry" title="Zet posts met status error opnieuw in de wachtrij">Mislukte opnieuw</button></div>
      <div class="row"><button id="wlCheck">Wanderlog: controleer</button><button id="wlDry">Proefrun sync</button><button id="wlSync" class="primary">Sync naar Wanderlog</button></div>
      <div class="row"><button id="wlRemDry">Proefrun verwijderen</button><button id="wlRem">Verwijder uitgevinkte uit Wanderlog</button></div>
      <pre id="syncOut" style="font-size:11px;white-space:pre-wrap;margin:4px 0 0;max-height:22vh;overflow:auto"></pre>
    </details>
  </header>
  <div id="detail" hidden></div>
  <div id="list"></div>
  <div class="posts" id="posts"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#008080","#9a6324","#808000","#000075"];
let cfg, pois = [], markers = {}, map, layer, catColor = {}, selectedId = null;
let embedOn = true; try { embedOn = localStorage.getItem("embedOn") !== "0"; } catch (e) {}

const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p, o).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t); }));
const patch = (id, body) => api(`/api/pois/${id}`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});

async function init() {
  cfg = await api("/api/config");
  $("#fBase").add(new Option("Alle locaties (dichtstbijzijnde)", "__any__"));
  Object.keys(cfg.bases).forEach(b => $("#fBase").add(new Option(b, b)));
  $("#fBase").add(new Option("(geen filter)", ""));
  cfg.categories.forEach((c,i) => { catColor[c] = COLORS[i % COLORS.length]; $("#fCat").add(new Option(c, c)); });
  map = L.map("map").setView([25.77,-80.2], 10);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  layer = L.layerGroup().addTo(map);
  map.on("click", () => { if (selectedId != null) deselect(); });
  ["fStatus","fCat","fBase","fKm"].forEach(id => $("#"+id).addEventListener("input", render));
  $("#refresh").onclick = load;
  const wl = async (url, opts, label) => {
    $("#tools").open = true;
    $("#syncOut").textContent = label + "…";
    try {
      const r = await api(url, opts);
      $("#syncOut").textContent = Array.isArray(r) ? (r.length ? r.map(x => `${x.status.toUpperCase()}: ${x.name} → ${x.lijst}${x.detail ? " (" + x.detail + ")" : ""}`).join("\n") : "Niets te syncen (geen gehouden POI's).") : JSON.stringify(r, null, 1);
    } catch (e) { $("#syncOut").textContent = "Fout: " + e.message; }
    load();
  };
  const post = dry => ({method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({dry_run:dry})});
  $("#wlCheck").onclick = () => wl("/api/sync/wanderlog/check", undefined, "Controleren");
  $("#wlDry").onclick = () => wl("/api/sync/wanderlog", post(true), "Proefrun");
  $("#wlRemDry").onclick = () => wl("/api/sync/wanderlog/remove", post(true), "Proefrun verwijderen");
  $("#wlRem").onclick = () => { const n = pois.filter(p => p.synced && p.status !== "keep").length; if (n && confirm(`${n} uitgevinkte/afgewezen POI's uit Wanderlog verwijderen?`)) wl("/api/sync/wanderlog/remove", post(false), "Verwijderen"); else if (!n) $("#syncOut").textContent = "Geen gesyncte POI's die zijn uitgevinkt."; };
  $("#wlSync").onclick = () => { if (confirm("Gehouden POI's nu toevoegen aan Wanderlog?")) wl("/api/sync/wanderlog", post(false), "Syncen"); };
  $("#retry").onclick = async () => { const r = await api("/api/posts/retry-failed", {method:"POST"}); $("#msg").textContent = `${r.retrying} posts opnieuw in de wachtrij…`; setTimeout(load, 5000); setTimeout(load, 15000); };
  $("#add").onclick = async () => {
    const text = $("#urls").value.trim(); if (!text) return;
    const r = await api("/api/posts", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
    $("#msg").textContent = `${r.new} nieuw, ${r.duplicates} al bekend. Parsen draait op de achtergrond…`;
    $("#urls").value = ""; setTimeout(load, 4000); setTimeout(load, 12000);
  };
  document.addEventListener("keydown", e => {
    if (e.target.closest("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const p = pois.find(x => x.id === selectedId);
    if (e.key === "Escape") deselect();
    else if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
    else if (p && e.key === "k") decide(p, p.status === "keep" ? "new" : "keep");
    else if (p && e.key === "x") decide(p, p.status === "reject" ? "new" : "reject");
  });
  await load();
}

async function load() {
  [pois] = await Promise.all([api("/api/pois"), loadPosts()]);
  render();
}

function dist(p, base) {
  const b = cfg.bases[base]; if (!b) return null;
  const r = Math.PI / 180, dLa = (p.lat - b[0]) * r, dLo = (p.lng - b[1]) * r;
  const a = Math.sin(dLa/2)**2 + Math.cos(b[0]*r) * Math.cos(p.lat*r) * Math.sin(dLo/2)**2;
  return Math.round(2 * 6371 * Math.asin(Math.sqrt(a)) * 10) / 10;
}

// Afstand tot het gekozen basispunt; bij "Alle locaties" tot het dichtstbijzijnde basispunt
function nearest(p, base) {
  if (base === "__any__") {
    let best = null;
    for (const b of Object.keys(cfg.bases)) { const d = dist(p, b); if (best === null || d < best.d) best = {d, name: b}; }
    return best;
  }
  const d = dist(p, base); return d === null ? null : {d, name: base};
}
const kmText = p => { const n = nearest(p, $("#fBase").value); return n ? `${n.d} km van ${esc(n.name)} · ` : ""; };

function visible(p) {
  const st = $("#fStatus").value, cat = $("#fCat").value, base = $("#fBase").value;
  const max = parseFloat($("#fKm").value) || 1e9;
  const n = nearest(p, base), d = n ? n.d : null;
  const stOk = st === "active" ? p.status !== "reject" : (!st || p.status === st);
  return stOk && (!cat || p.category === cat) && (d === null || d <= max);
}

function groups() {
  const byCat = {};
  pois.filter(p => visible(p) || p.id === selectedId).forEach(p => (byCat[p.category] ||= []).push(p));
  return Object.keys(byCat).sort().map(c => [c, byCat[c]]);
}
const orderNow = () => groups().flatMap(([, ps]) => ps.map(p => p.id));

function render() {
  layer.clearLayers(); markers = {};
  const gs = groups(), vis = gs.flatMap(([, ps]) => ps);
  $("#counts").textContent = `(${vis.length}/${pois.length} · ${pois.filter(p => p.status === "keep").length} gehouden)`;
  const list = $("#list"), top = list.scrollTop; list.innerHTML = "";
  gs.forEach(([cat, ps]) => {
    const h = document.createElement("div"); h.className = "cat"; h.textContent = `${cat} (${ps.length})`; list.append(h);
    ps.forEach(p => list.append(row(p)));
  });
  list.scrollTop = top;
  vis.forEach(p => {
    const sel = p.id === selectedId;
    const m = L.circleMarker([p.lat, p.lng], {radius: sel ? 13 : p.status === "keep" ? 10 : 7, color: sel ? "#000" : "#fff", weight: sel ? 3 : 1.5,
      fillColor: catColor[p.category] || "#888", fillOpacity: p.status === "reject" ? .25 : .9, bubblingMouseEvents: false})
      .addTo(layer).bindTooltip(esc(p.name));
    m.on("click", () => select(p.id, {scroll: true}));
    if (sel) m.bringToFront();
    markers[p.id] = m;
  });
  renderDetail();
}

function select(id, o = {}) {
  selectedId = id; render();
  const p = pois.find(x => x.id === id);
  if (o.pan && p) map.setView([p.lat, p.lng], Math.max(map.getZoom(), 13));
  if (o.scroll) document.querySelector(`.poi[data-id="${id}"]`)?.scrollIntoView({block: "nearest"});
}

function deselect() { selectedId = null; render(); }

function step(d) {
  const o = orderNow(); if (!o.length) return;
  const i = o.indexOf(selectedId);
  select(o[Math.min(Math.max(i + d, 0), o.length - 1)] ?? o[0], {pan: true, scroll: true});
}

// Beslissing nemen: de selectie blijft op deze POI (die zichtbaar blijft tot je naar een andere gaat)
async function decide(p, status) {
  await patch(p.id, {status}); p.status = status;
  select(p.id, {scroll: true});
}

function renderDetail() {
  const el = $("#detail"), p = pois.find(x => x.id === selectedId);
  if (!p) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false; el.innerHTML = "";
  const base = $("#fBase").value;
  const head = document.createElement("div"); head.style.position = "relative";
  head.innerHTML = `<button id="closeDetail" title="Deselecteren (Esc)" style="position:absolute;right:0;top:0;padding:0 8px;font-size:16px;line-height:22px">×</button><div style="font-weight:600;font-size:15px;padding-right:32px">${esc(p.name)}${p.synced ? '<span class="tag synced">in Wanderlog</span>' : ""}</div>
    <small>${esc(p.address || "")}</small>
    <small>${kmText(p)}${p.sources.length}× genoemd${p.gmaps_url ? ` · <a target="_blank" href="${p.gmaps_url}">kaart</a>` : ""}</small>`;
  head.querySelector("#closeDetail").onclick = deselect;
  const acts = document.createElement("div"); acts.className = "row acts";
  const keep = Object.assign(document.createElement("button"), {className: "keep" + (p.status === "keep" ? " on" : ""), textContent: p.status === "keep" ? "✓ Gehouden (klik om te herstellen)" : "Houden (k)"});
  keep.onclick = () => decide(p, p.status === "keep" ? "new" : "keep");
  const rej = Object.assign(document.createElement("button"), {className: "rej" + (p.status === "reject" ? " on" : ""), textContent: p.status === "reject" ? "Afgewezen: Herstel" : "Afwijzen (x)"});
  rej.onclick = () => decide(p, p.status === "reject" ? "new" : "reject");
  acts.append(keep, rej);
  const nav = document.createElement("div"); nav.className = "row";
  const sel = document.createElement("select"); sel.style.flex = "2";
  cfg.categories.forEach(c => sel.add(new Option(c, c, false, c === p.category)));
  sel.onchange = async () => { p.category = sel.value; await patch(p.id, {category: sel.value}); render(); };
  const prev = Object.assign(document.createElement("button"), {textContent: "↑", title: "Vorige (pijl omhoog)"}); prev.style.flex = "0"; prev.onclick = () => step(-1);
  const next = Object.assign(document.createElement("button"), {textContent: "↓", title: "Volgende (pijl omlaag)"}); next.style.flex = "0"; next.onclick = () => step(1);
  nav.append(sel, prev, next);
  el.append(head, acts, nav);
  const emb = document.createElement("label"); emb.style.cssText = "display:block;margin-top:8px;font-size:12px";
  const cb = Object.assign(document.createElement("input"), {type: "checkbox", checked: embedOn});
  cb.onchange = () => { embedOn = cb.checked; try { localStorage.setItem("embedOn", embedOn ? "1" : "0"); } catch (e) {} renderDetail(); };
  emb.append(cb, " Toon de post hier"); el.append(emb);
  p.sources.forEach(s => {
    const d = document.createElement("div"); d.className = "src";
    d.innerHTML = `${s.evidence ? `<blockquote>${esc(s.evidence)}</blockquote>` : ""}<a target="_blank" href="${s.url}">Open post op Instagram</a>`;
    if (embedOn) {
      const f = document.createElement("iframe"); f.loading = "lazy"; f.src = `https://www.instagram.com/p/${s.shortcode}/embed/`;
      f.style.cssText = "width:100%;height:520px;border:1px solid var(--bd);border-radius:6px;margin-top:6px";
      d.append(f);
    }
    el.append(d);
  });
  const hint = document.createElement("small"); hint.style.marginTop = "8px";
  hint.innerHTML = "Sneltoetsen: <kbd>↑</kbd><kbd>↓</kbd> navigeren · <kbd>k</kbd> houden · <kbd>x</kbd> afwijzen · <kbd>Esc</kbd> deselecteren"; el.append(hint);
}

function row(p) {
  const d = document.createElement("div"); d.className = "poi " + p.status + (p.id === selectedId ? " sel" : ""); d.dataset.id = p.id;
  const cb = Object.assign(document.createElement("input"), {type: "checkbox", checked: p.status === "keep"});
  cb.onclick = e => e.stopPropagation();
  cb.onchange = async () => { p.status = cb.checked ? "keep" : "new"; await patch(p.id, {status: p.status}); render(); };
  const body = document.createElement("div");
  body.innerHTML = `<span class="n">${esc(p.name)}</span>${p.synced ? '<span class="tag synced">in Wanderlog</span>' : ""}
    <small>${esc(p.address || "")}</small>
    <small>${kmText(p)}${p.sources.length}× genoemd</small>`;
  d.onclick = () => select(p.id, {pan: true});
  d.append(cb, body); return d;
}

async function loadPosts() {
  const ps = await api("/api/posts");
  const el = $("#posts");
  const pending = ps.filter(p => p.status !== "parsed");
  el.innerHTML = `<b>Posts: ${ps.length}</b> (${ps.length-pending.length} geparsed)`;
  pending.forEach(p => {
    const d = document.createElement("div"); d.style.marginTop = "6px";
    d.innerHTML = `<a target=_blank href="${p.url}">${p.shortcode}</a> — ${p.status}${p.error?": "+esc(p.error):""}`;
    if (p.status === "needs_text" || p.status === "error") {
      const ta = document.createElement("textarea"); ta.placeholder = "Plak caption / noem de plek(ken) uit de video…";
      const b = document.createElement("button"); b.textContent = "Parse";
      b.onclick = async () => { await api(`/api/posts/${p.shortcode}/text`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:ta.value})}); setTimeout(load, 4000); };
      d.append(ta, b);
    }
    el.append(d);
  });
  const det = document.createElement("details"); det.style.marginTop = "8px";
  det.innerHTML = `<summary>Alle posts: wat is eruit gehaald</summary>`;
  ps.filter(p => p.status === "parsed").forEach(p => {
    let c = []; try { c = JSON.parse(p.parsed) || []; } catch (e) {}
    const ok = c.filter(x => x.resolved).length;
    const d = document.createElement("details");
    d.innerHTML = `<summary><a target=_blank href="${p.url}">${p.shortcode}</a> — ${ok}/${c.length} plekken gekoppeld</summary>` +
      `<ul style="margin:4px 0 4px 16px;padding:0">${c.map(x => `<li>${x.resolved ? "✓" : "✗"} ${esc(x.name)}${x.city ? ", " + esc(x.city) : ""}</li>`).join("")}</ul>` +
      `<pre style="white-space:pre-wrap;font-size:11px;max-height:120px;overflow:auto">${esc(p.caption || "")}</pre>`;
    det.append(d);
  });
  el.append(det);
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
init();
</script>
</body>
</html>
